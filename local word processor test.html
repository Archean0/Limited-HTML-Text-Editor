<!DOCTYPE html>
<html>
<head>
<style>
  body {
    -webkit-user-select: none;
    user-select: none;
  }
  textarea {
    width: 100%;
    height: 90vh;
    font-size: 18px;
  }
</style>
</head>
<body oncontextmenu="return false;">
<textarea 
  onpaste="return false;" 
  oncopy="return false;" 
  oncut="return false;">
</textarea>

<script>
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'c' || e.key === 'x' || e.key === 'a')) {
    e.preventDefault();
  }
});
</script>
</body>
</html>
