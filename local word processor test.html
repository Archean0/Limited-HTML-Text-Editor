<!DOCTYPE html>
<html>
<head>
<style>
  body {
    -webkit-user-select: none;
    user-select: none;
    margin: 0;
  }
  textarea {
    width: 100%;
    height: 100vh;
    font-size: 18px;
    box-sizing: border-box;
  }
</style>
</head>
<body oncontextmenu="return false;">

<textarea
  onpaste="return false;"
  oncopy="return false;"
  oncut="return false;"
  ondrop="return false;"
  ondragover="return false;">
</textarea>

<script>
// Block keyboard shortcuts like Ctrl/⌘ + V, C, X, A
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) &&
      (e.key === 'v' || e.key === 'c' || e.key === 'x' || e.key === 'a')) {
    e.preventDefault();
  }
});

// Extra safety: block drop events at the document level too
document.addEventListener('drop', function(e) {
  e.preventDefault();
}, false);

document.addEventListener('dragover', function(e) {
  e.preventDefault();
}, false);
</script>

</body>
</html>
